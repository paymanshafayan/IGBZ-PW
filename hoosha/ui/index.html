<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-density="comfy">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>هوشا</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="app">

	<!-- ─────────────────────────────────────────────── نوار کناری -->
	<aside class="sidebar" id="sidebar">
		<div class="side-head">
			<div class="brand">
				<span class="mark"></span>
				<span class="brand-name">هوشا</span>
				<span class="brand-version" id="brand-version" title="نسخهٔ در حال اجرا">…</span>
			</div>
			<button class="icon-btn" id="btn-collapse" title="جمع‌کردن نوار کناری">⟨⟩</button>
		</div>

		<button class="new-session" id="btn-new">
			<span class="plus">+</span> <span>گفتگوی تازه</span>
		</button>

		<div class="side-search">
			<input id="session-search" type="search" placeholder="جستجوی گفتگو…  (Ctrl+K)" />
		</div>

		<div class="side-scroll">
			<div id="session-list" class="session-list"></div>
		</div>

		<div class="side-foot">
			<button class="side-item" id="btn-workspace" title="تغییر پوشهٔ کاری">
				<span class="si-ico">▤</span>
				<span class="grow-txt" id="chip-workspace">…</span>
			</button>
			<button class="side-item" id="btn-settings" title="تنظیمات (Ctrl+,)">
				<span class="si-ico">⚙</span>
				<span class="grow-txt" id="chip-provider">تنظیمات</span>
			</button>
		</div>
	</aside>

	<!-- ─────────────────────────────────────────────── ناحیهٔ اصلی -->
	<main class="main">
		<header class="topbar">
			<button class="icon-btn only-narrow" id="btn-menu" title="منو">☰</button>
			<div class="title" id="session-title">گفتگوی تازه</div>

			<div class="top-right">
				<span class="badge" id="badge-mode" data-mode="default">◈ عادی</span>
				<span class="meter" id="context-meter" title="مصرف کانتکست">
					<span class="meter-fill" id="meter-fill"></span>
					<span class="meter-text" id="meter-text">۰٪</span>
				</span>
				<span class="cost" id="cost-chip" title="هزینهٔ تخمینی این نشست"></span>
				<button class="icon-btn" id="btn-export" title="خروجی گفتگو">⤓</button>
				<button class="icon-btn" id="btn-help" title="میان‌برها">?</button>
				<button class="icon-btn" id="btn-rail" title="پنل کناری (Ctrl+B)">▥</button>
			</div>
		</header>

		<div class="thread" id="chat">
			<div class="welcome" id="welcome">
				<div class="welcome-mark"></div>
				<h1>هوشا</h1>
				<p>یک دستیار عامل که روی دستگاه خودت اجرا می‌شود، ابزار واقعی دارد و با هر پرووایدری کار می‌کند.</p>
				<div class="starter" id="starter"></div>
			</div>
		</div>

		<div class="composer-shell">
			<div id="queue" class="queue" hidden></div>
			<div id="cmd-menu" class="cmd-menu" hidden></div>
			<div id="model-menu" class="cmd-menu model-menu" hidden></div>

			<form id="composer" class="composer">
				<div id="attachments" class="attachments" hidden></div>
				<textarea id="input" rows="1" placeholder="چه کاری انجام بدهم؟  «@» برای فایل، «/» برای دستور، تصویر را بچسبان"></textarea>

				<div class="composer-bar">
					<div class="composer-left">
						<button type="button" class="pill mode-pill" id="pill-mode" data-mode="default" title="حالت کار (Shift+Tab)">◈ عادی</button>
						<button type="button" class="pill" id="pill-model" title="مدل — کلیک کن تا عوض شود">—</button>
						<button type="button" class="pill" id="btn-attach" title="افزودن تصویر">🖼</button>
						<input type="file" id="file-input" accept="image/*" multiple hidden />
					</div>
					<div class="composer-right">
						<span class="hint">Enter ارسال · Shift+Enter خط تازه · Shift+Tab حالت</span>
						<button id="stop" type="button" class="circle stop" hidden title="توقف (Esc)">■</button>
						<button id="send" type="submit" class="circle" title="ارسال">↑</button>
					</div>
				</div>
			</form>
		</div>
	</main>

	<!-- ─────────────────────────────────────────────── ریل کناری -->
	<aside class="rail" id="rail">
		<div class="rail-tabs">
			<button class="rail-tab active" data-tab="todos">کارها <b class="rail-count"></b></button>
			<button class="rail-tab" data-tab="shells">شل‌ها <b class="rail-count"></b></button>
			<button class="rail-tab" data-tab="checkpoints">چک‌پوینت <b class="rail-count"></b></button>
			<button class="rail-tab" data-tab="git">گیت <b class="rail-count"></b></button>
		</div>
		<div class="rail-body" id="rail-body"></div>
	</aside>
</div>

<!-- ───────────────────────────────────────────────────── تنظیمات -->
<dialog id="settings" class="modal settings-modal">
	<div class="settings-shell">
		<nav class="settings-nav" id="settings-nav"></nav>
		<div class="settings-main">
			<div class="settings-top">
				<h2>تنظیمات</h2>
				<button class="icon-btn" id="settings-close" title="بستن">×</button>
			</div>
			<div class="settings-content" id="settings-content"></div>
		</div>
	</div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
