<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>هوشا</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#262624" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="app">

	<!-- ══════════════════════════════════════════════════ نوار کناری -->
	<aside class="sidebar" id="sidebar">

		<div class="side-top">
			<div class="wordmark"><span class="mark" id="brand-mark"></span>هوشا<span class="ver" id="brand-version"></span></div>
			<button class="ghost-icon" id="btn-collapse" title="بستن نوار کناری">
				<svg viewBox="0 0 20 20" width="18" height="18"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="7.5" y1="3.5" x2="7.5" y2="16.5" stroke="currentColor" stroke-width="1.4"/></svg>
			</button>
		</div>

		<button class="new-chat" id="btn-new">
			<span class="nc-plus">+</span><span>گفتگوی تازه</span>
		</button>

		<nav class="side-nav" id="side-nav">
			<button class="nav-item active" data-view="chat">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M3 6.5A3.5 3.5 0 016.5 3h7A3.5 3.5 0 0117 6.5v4A3.5 3.5 0 0113.5 14H8l-4 3v-3.2A3.5 3.5 0 013 10.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
				<span>گفتگوها</span>
			</button>
			<button class="nav-item" data-view="tools">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M12.5 2.5a4 4 0 00-3.6 5.7L3 14.1V17h2.9l5.9-5.9a4 4 0 105.2-5.2l-2.4 2.4-1.8-1.8 2.4-2.4a4 4 0 00-2.7-1.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
				<span>ابزارها</span>
			</button>
			<button class="nav-item" data-view="connectors">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M7 4v4M13 4v4M5 8h10v3a5 5 0 01-10 0z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10 16v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
				<span>کانکتورها</span>
			</button>
			<button class="nav-item" data-view="skills">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M10 2.5l2.2 4.7 5.1.7-3.7 3.5.9 5.1L10 14l-4.5 2.5.9-5.1L2.7 7.9l5.1-.7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
				<span>اسکیل‌ها</span>
			</button>
			<button class="nav-item" data-view="agents">
				<svg viewBox="0 0 20 20" width="17" height="17"><rect x="3.5" y="6.5" width="13" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 3.5v3M7 11h.01M13 11h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
				<span>زیرعامل‌ها</span>
			</button>
			<button class="nav-item" data-view="workspace">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M3 6.5A1.5 1.5 0 014.5 5h3l1.5 2h6.5A1.5 1.5 0 0117 8.5v6A1.5 1.5 0 0115.5 16h-11A1.5 1.5 0 013 14.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
				<span>فضای کار</span>
			</button>
		</nav>

		<div class="side-recents">
			<div class="side-label">نشان‌شده</div>
			<div id="pinned-list" class="session-list"></div>
		</div>

		<div class="side-bottom">
			<div class="account-row">
				<button class="account-main" id="btn-account" title="پروفایل و پرووایدر">
					<span class="avatar-dot" id="account-initial">ه</span>
					<span class="acc-lines">
						<b id="account-name">پروفایل</b>
						<span class="acc-text" id="chip-provider">—</span>
					</span>
				</button>
				<button class="round-ghost" data-view="settings" id="btn-settings" title="تنظیمات">
					<svg viewBox="0 0 20 20" width="17" height="17"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4M15.3 15.3l-1.4-1.4M6.1 6.1L4.7 4.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
				</button>
			</div>
		</div>
	</aside>

	<!-- ════════════════════════════════════ ستون فهرست نشست‌ها -->
	<aside class="list-col" id="list-col">
		<div class="list-head">
			<button class="project-chip" id="project-chip" title="انتخاب پروژه">
				<svg viewBox="0 0 20 20" width="15" height="15"><path d="M3 6.5A1.5 1.5 0 014.5 5h3l1.5 2h6.5A1.5 1.5 0 0117 8.5v6A1.5 1.5 0 0115.5 16h-11A1.5 1.5 0 013 14.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
				<span id="project-name">پروژه</span>
				<svg viewBox="0 0 20 20" width="12" height="12"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</button>
			<div id="project-menu" class="pop-menu project-menu" hidden></div>
			<span class="grow"></span>
			<button class="round-ghost" id="btn-search" title="جستجو (Ctrl+K)">
				<svg viewBox="0 0 20 20" width="17" height="17"><circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
			</button>
			<button class="round-ghost only-narrow" id="btn-menu" title="منو">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
			</button>
		</div>
		<div class="list-scroll" id="session-list"></div>
	</aside>

	<!-- ══════════════════════════════════════════════════ ناحیهٔ اصلی -->
	<main class="main">
	 <div class="main-card">

		<header class="topbar">
			<button class="round-ghost raised" id="btn-back" title="بازگشت به گفتگو">
				<svg viewBox="0 0 20 20" width="16" height="16"><path d="M12 5l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</button>

			<button class="chat-title" id="session-title">
				<span id="session-title-text">گفتگوی تازه</span>
			</button>

			<div class="top-right">
				<span class="ctx-chip" id="context-meter" title="مصرف کانتکست"><span id="meter-text">۰٪</span></span>
				<button class="round-ghost raised" id="btn-rail" title="پنل کناری (Ctrl+B)">
					<svg viewBox="0 0 20 20" width="16" height="16"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="12.5" y1="3.5" x2="12.5" y2="16.5" stroke="currentColor" stroke-width="1.4"/></svg>
				</button>
				<button class="round-ghost raised" id="btn-more" title="بیشتر">
					<svg viewBox="0 0 20 20" width="16" height="16"><circle cx="5" cy="10" r="1.4" fill="currentColor"/><circle cx="10" cy="10" r="1.4" fill="currentColor"/><circle cx="15" cy="10" r="1.4" fill="currentColor"/></svg>
				</button>
				<div id="more-menu" class="pop-menu more-menu" hidden></div>
			</div>
		</header>

		<!-- نمای گفتگو -->
		<div class="view view-chat" id="view-chat">
			<div class="thread" id="chat">
				<div class="welcome" id="welcome">
					<div class="greet"><span class="greet-mark" id="greet-mark"></span><span id="greet-text">امروز چه کاری انجام بدهم؟</span></div>
				</div>
			</div>

			<div class="composer-wrap">
				<div id="queue" class="queue" hidden></div>
				<div id="cmd-menu" class="pop-menu" hidden></div>
				<div id="plus-menu" class="pop-menu plus-menu" hidden></div>
				<div id="model-menu" class="pop-menu model-menu" hidden></div>

				<form id="composer" class="composer">
					<div id="attachments" class="attachments" hidden></div>
					<textarea id="input" rows="1" placeholder="پیامی بنویس…"></textarea>

					<div class="composer-bar">
						<button type="button" class="round-btn" id="btn-plus" title="افزودن و ابزارها">+</button>
						<input type="file" id="file-input" accept="image/*" multiple hidden />
						<button type="button" class="round-btn" id="btn-mic" title="گفتن به‌جای نوشتن (Ctrl+M)">
							<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="7.5" y="2.5" width="5" height="9" rx="2.5"/><path d="M4.5 9.5a5.5 5.5 0 0011 0M10 15v2.5"/></svg>
						</button>

						<span class="grow"></span>

						<button type="button" class="mode-chip" id="pill-mode" data-mode="default" title="حالت کار (Shift+Tab)">عادی</button>
						<button type="button" class="model-chip" id="pill-model" title="مدل">
							<span id="model-name">—</span>
							<svg viewBox="0 0 20 20" width="13" height="13"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
						</button>
						<button id="stop" type="button" class="round-btn stop" hidden title="توقف (Esc)">■</button>
						<button id="send" type="submit" class="round-btn send" title="ارسال">
							<svg viewBox="0 0 20 20" width="16" height="16"><path d="M10 16V5M5.5 9.5L10 5l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
						</button>
					</div>
					<div class="git-bar" id="git-bar" hidden>
						<button type="button" class="git-chip repo" id="git-repo" title="مخزن — کلیک برای تعویض یا اتصال">
							<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4.5A1.5 1.5 0 015.5 3H15v11H5.5A1.5 1.5 0 004 15.5z"/><path d="M4 15.5A1.5 1.5 0 015.5 14H15v3H5.5A1.5 1.5 0 014 15.5z"/></svg>
							<span id="git-repo-name">—</span>
						</button>

						<button type="button" class="git-chip branch" id="git-branch" title="شاخه — کلیک برای تعویض یا ساخت">
							<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="15" r="2"/><circle cx="14" cy="8" r="2"/><path d="M6 7v6M8 8h2a2 2 0 012 2v3"/></svg>
							<span id="git-branch-name">—</span>
						</button>

						<button type="button" class="git-stat" id="git-stat" title="تغییرات — کلیک برای دیدن دیف">
							<span class="plus" id="git-plus">+۰</span>
							<span class="minus" id="git-minus">−۰</span>
						</button>

						<button type="button" class="git-action" id="git-action">ثبت تغییرات</button>
					</div>
				</form>

				<div id="git-menu" class="pop-menu git-menu" hidden></div>

				<p class="disclaimer">هوشا هم اشتباه می‌کند. کارهای مهم را خودت بازبینی کن.</p>
			</div>
		</div>

		<!-- نمای پنل‌ها (ابزارها، کانکتورها، …) -->
		<div class="view view-panel" id="view-panel" hidden>
			<div class="panel-scroll" id="panel-body"></div>
		</div>
	 </div>
	</main>

	<!-- ══════════════════════════════════════════════════ ریل کناری -->
	<aside class="rail" id="rail">
		<div class="rail-tabs">
			<button class="rail-tab active" data-tab="todos">کارها <b class="rail-count"></b></button>
			<button class="rail-tab" data-tab="shells">شل‌ها <b class="rail-count"></b></button>
			<button class="rail-tab" data-tab="checkpoints">بازگشت <b class="rail-count"></b></button>
			<button class="rail-tab" data-tab="git">گیت <b class="rail-count"></b></button>
		</div>
		<div class="rail-body" id="rail-body"></div>
	</aside>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
