<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>هوشا</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#faf9f5" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- وقتی سرور از یک کپیِ منجمد اجرا شده باشد، این نوار ظاهر می‌شود. پیش‌فرض پنهان است
     و فقط app.js با دیدن install.frozen بازش می‌کند. -->
<div class="stale-bar" id="stale-bar" hidden></div>

<!--
	چیدمان: دو ستون.

	یک نوار کناری و یک ناحیهٔ محتوا — همان چیزی که در تصاویر Claude هست. ستون میانیِ
	فهرست گفتگو و ریل سمت دیگر حذف شدند: اولی داخل نوار کناری رفت (زیر «اخیر») و دومی
	به صفحهٔ فضای کار.
-->
<div class="app">

	<!-- ══════════════════════════════════════════════════ نوار کناری -->
	<aside class="sidebar" id="sidebar">

		<div class="side-top">
			<div class="wordmark">هوشا<span class="ver" id="brand-version"></span></div>
			<div class="side-top-actions">
				<button class="btn icon round quiet" id="btn-search" title="جستجو (Ctrl+K)" data-t-title="جستجو (Ctrl+K)">
					<svg class="ic " viewBox="0 0 512 512" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M508.5 481.6l-129-129c-2.3-2.3-5.3-3.5-8.5-3.5h-10.3C395 312 416 262.5 416 208 416 93.1 322.9 0 208 0S0 93.1 0 208s93.1 208 208 208c54.5 0 104-21 141.1-55.2V371c0 3.2 1.3 6.2 3.5 8.5l129 129c4.7 4.7 12.3 4.7 17 0l9.9-9.9c4.7-4.7 4.7-12.3 0-17zM208 384c-97.3 0-176-78.7-176-176S110.7 32 208 32s176 78.7 176 176-78.7 176-176 176z" /></svg>
				</button>
				<button class="btn icon round quiet" id="btn-collapse" title="بستن نوار کناری" data-t-title="بستن نوار کناری">
					<svg class="ic " viewBox="0 0 512 512" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M464 32H48C21.49 32 0 53.49 0 80v352c0 26.51 21.49 48 48 48h416c26.51 0 48-21.49 48-48V80c0-26.51-21.49-48-48-48zM240 448H48c-8.837 0-16-7.163-16-16V96h208v352zm240-16c0 8.837-7.163 16-16 16H272V96h208v336z" /></svg>

			</div>
		</div>

		<button class="btn quiet row new-chat" id="btn-new">
			<span class="nc-plus"><svg class="ic " viewBox="0 0 384 512" width="15" height="15" fill="currentColor" aria-hidden="true" focusable="false"><path d="M376 232H216V72c0-4.42-3.58-8-8-8h-32c-4.42 0-8 3.58-8 8v160H8c-4.42 0-8 3.58-8 8v32c0 4.42 3.58 8 8 8h160v160c0 4.42 3.58 8 8 8h32c4.42 0 8-3.58 8-8V280h160c4.42 0 8-3.58 8-8v-32c0-4.42-3.58-8-8-8z" /></svg></span><span data-t="گفتگوی تازه">گفتگوی تازه</span>
		</button>

		<nav class="side-nav" id="side-nav">
			<button class="btn quiet row nav-item" data-view="chats">

				<span data-t="پروژه‌ها">پروژه‌ها</span>
			</button>
			<button class="btn quiet row nav-item" data-view="tools">
				<svg class="ic " viewBox="0 0 512 512" width="17" height="17" fill="currentColor" aria-hidden="true" focusable="false"><path d="M502.63 214.63l-45.25-45.26c-6-6-14.14-9.37-22.63-9.37H384V80c0-26.47-21.53-48-48-48H176c-26.47 0-48 21.53-48 48v80H77.25c-8.49 0-16.62 3.37-22.63 9.37L9.37 214.63c-6 6-9.37 14.14-9.37 22.63V448c0 17.67 14.33 32 32 32h448c17.67 0 32-14.33 32-32V237.25c0-8.48-3.37-16.62-9.37-22.62zM160 80c0-8.83 7.19-16 16-16h160c8.81 0 16 7.17 16 16v80H160V80zm320 368H32v-96h96v24c0 4.42 3.58 8 8 8h16c4.42 0 8-3.58 8-8v-24h192v24c0 4.42 3.58 8 8 8h16c4.42 0 8-3.58 8-8v-24h96v96zm-96-128v-24c0-4.42-3.58-8-8-8h-16c-4.42 0-8 3.58-8 8v24H160v-24c0-4.42-3.58-8-8-8h-16c-4.42 0-8 3.58-8 8v24H32v-82.75L77.25 192h357.49L480 237.25V320h-96z" /></svg>
				<span data-t="ابزارها">ابزارها</span>
			</button>
			<button class="btn quiet row nav-item" data-view="changes">
				<svg class="ic " viewBox="0 0 384 512" width="17" height="17" fill="currentColor" aria-hidden="true" focusable="false"><path d="M384 144c0-44.2-35.8-80-80-80s-80 35.8-80 80c0 39.2 28.2 71.8 65.5 78.7-.8 17.2-5 30.4-12.7 40-17.5 21.8-53.1 25.2-90.7 28.7-28.2 2.6-57.4 5.4-80.4 16.9-3.4 1.7-6.7 3.6-9.7 5.7V158.4c36.5-7.4 64-39.7 64-78.4 0-44.2-35.8-80-80-80S0 35.8 0 80c0 38.7 27.5 71 64 78.4v195.2C27.5 361 0 393.3 0 432c0 44.2 35.8 80 80 80s80-35.8 80-80c0-36.9-24.9-67.9-58.9-77.2 5-9.6 12.3-14.6 19-18 17.5-8.8 42.5-11.2 68.9-13.7 42.6-4 86.7-8.1 112.7-40.5 12.4-15.5 19-35.5 19.8-60.7C357.3 214 384 182.1 384 144zM32 80c0-26.5 21.5-48 48-48s48 21.5 48 48-21.5 48-48 48-48-21.5-48-48zm96 352c0 26.5-21.5 48-48 48s-48-21.5-48-48c0-26.4 21.4-47.9 47.8-48h.6c26.3.2 47.6 21.7 47.6 48zm187.8-241.5L304 192c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48c0 22.4-15.4 41.2-36.2 46.5z" /></svg>
				<span data-t="تغییرات">تغییرات</span>
				<b class="nav-badge" id="nav-changes-count" hidden></b>
			</button>
			<button class="btn quiet row nav-item" data-view="customize">
				<svg class="ic " viewBox="0 0 512 512" width="17" height="17" fill="currentColor" aria-hidden="true" focusable="false"><path d="M504 384H192v-40c0-13.3-10.7-24-24-24h-48c-13.3 0-24 10.7-24 24v40H8c-4.4 0-8 3.6-8 8v16c0 4.4 3.6 8 8 8h88v40c0 13.3 10.7 24 24 24h48c13.3 0 24-10.7 24-24v-40h312c4.4 0 8-3.6 8-8v-16c0-4.4-3.6-8-8-8zm-344 64h-32v-96h32v96zM504 96H256V56c0-13.3-10.7-24-24-24h-48c-13.3 0-24 10.7-24 24v40H8c-4.4 0-8 3.6-8 8v16c0 4.4 3.6 8 8 8h152v40c0 13.3 10.7 24 24 24h48c13.3 0 24-10.7 24-24v-40h248c4.4 0 8-3.6 8-8v-16c0-4.4-3.6-8-8-8zm-280 64h-32V64h32v96zm280 80h-88v-40c0-13.3-10.7-24-24-24h-48c-13.3 0-24 10.7-24 24v40H8c-4.4 0-8 3.6-8 8v16c0 4.4 3.6 8 8 8h312v40c0 13.3 10.7 24 24 24h48c13.3 0 24-10.7 24-24v-40h88c4.4 0 8-3.6 8-8v-16c0-4.4-3.6-8-8-8zm-120 64h-32v-96h32v96z" /></svg>
				<span data-t="سفارشی‌سازی">سفارشی‌سازی</span>
			</button>
		</nav>

		<div class="side-label" data-t="امکانات">امکانات</div>
		<nav class="side-nav">
			<button class="btn quiet row nav-item" data-view="workspace">
				<svg class="ic " viewBox="0 0 512 512" width="17" height="17" fill="currentColor" aria-hidden="true" focusable="false"><path d="M464 32H48C21.5 32 0 53.5 0 80v352c0 26.5 21.5 48 48 48h416c26.5 0 48-21.5 48-48V80c0-26.5-21.5-48-48-48zM32 80c0-8.8 7.2-16 16-16h48v64H32V80zm448 352c0 8.8-7.2 16-16 16H48c-8.8 0-16-7.2-16-16V160h448v272zm0-304H128V64h336c8.8 0 16 7.2 16 16v48z" /></svg>
				<span data-t="فضای کار">فضای کار</span>
			</button>
		</nav>

		<div class="side-label">
			<span class="grow" data-t="اخیر">اخیر</span>
			<button class="btn icon round quiet" id="btn-recents-more" title="همهٔ گفتگوها" data-t-title="همهٔ گفتگوها">
				<svg class="ic " viewBox="0 0 512 512" width="15" height="15" fill="currentColor" aria-hidden="true" focusable="false"><path d="M32.39 224C14.73 224 0 238.33 0 256s14.73 32 32.39 32a32 32 0 0 0 0-64zm0-160C14.73 64 0 78.33 0 96s14.73 32 32.39 32a32 32 0 0 0 0-64zm0 320C14.73 384 0 398.33 0 416s14.73 32 32.39 32a32 32 0 0 0 0-64zM504 80H136a8 8 0 0 0-8 8v16a8 8 0 0 0 8 8h368a8 8 0 0 0 8-8V88a8 8 0 0 0-8-8zm0 160H136a8 8 0 0 0-8 8v16a8 8 0 0 0 8 8h368a8 8 0 0 0 8-8v-16a8 8 0 0 0-8-8zm0 160H136a8 8 0 0 0-8 8v16a8 8 0 0 0 8 8h368a8 8 0 0 0 8-8v-16a8 8 0 0 0-8-8z" /></svg>
			</button>
		</div>
		<div class="side-scroll" id="session-list"></div>

		<div class="side-bottom">
			<div class="account-row">
				<button class="btn quiet row account-main" id="btn-account" title="حساب و تنظیمات" data-t-title="حساب و تنظیمات">
					<span class="avatar-dot" id="account-initial">ه</span>
					<span class="acc-lines">
						<b id="account-name">پروفایل</b>
						<span class="acc-text" id="chip-provider">—</span>
					</span>
					<svg class="ic acc-chev" viewBox="0 0 448 512" width="13" height="13" fill="currentColor" aria-hidden="true" focusable="false"><path d="M4.465 366.475l7.07 7.071c4.686 4.686 12.284 4.686 16.971 0L224 178.053l195.494 195.493c4.686 4.686 12.284 4.686 16.971 0l7.07-7.071c4.686-4.686 4.686-12.284 0-16.97l-211.05-211.051c-4.686-4.686-12.284-4.686-16.971 0L4.465 349.505c-4.687 4.686-4.687 12.284 0 16.97z" /></svg>
				</button>
				<button class="btn icon round quiet" id="btn-export" title="خروجی گفتگو">
					<svg class="ic " viewBox="0 0 512 512" width="15" height="15" fill="currentColor" aria-hidden="true" focusable="false"><path d="M452 432c0 11-9 20-20 20s-20-9-20-20 9-20 20-20 20 9 20 20zm-84-20c-11 0-20 9-20 20s9 20 20 20 20-9 20-20-9-20-20-20zm144-48v104c0 24.3-19.7 44-44 44H44c-24.3 0-44-19.7-44-44V364c0-24.3 19.7-44 44-44h99.4L87 263.6c-25.2-25.2-7.3-68.3 28.3-68.3H168V40c0-22.1 17.9-40 40-40h96c22.1 0 40 17.9 40 40v155.3h52.7c35.6 0 53.4 43.1 28.3 68.3L368.6 320H468c24.3 0 44 19.7 44 44zm-261.7 17.7c3.1 3.1 8.2 3.1 11.3 0L402.3 241c5-5 1.5-13.7-5.7-13.7H312V40c0-4.4-3.6-8-8-8h-96c-4.4 0-8 3.6-8 8v187.3h-84.7c-7.1 0-10.7 8.6-5.7 13.7l140.7 140.7zM480 364c0-6.6-5.4-12-12-12H336.6l-52.3 52.3c-15.6 15.6-41 15.6-56.6 0L175.4 352H44c-6.6 0-12 5.4-12 12v104c0 6.6 5.4 12 12 12h424c6.6 0 12-5.4 12-12V364z" /></svg>
				</button>
			</div>
			<div class="account-menu" id="account-menu" hidden></div>
		</div>
	</aside>

	<!-- ══════════════════════════════════════════════════ ناحیهٔ اصلی -->
	<main class="main">
	 <div class="main-card">

		<header class="topbar">
			<button class="btn icon round quiet" id="btn-back" title="بازگشت به گفتگو" data-t-title="بازگشت به گفتگو" hidden>
				<svg class="ic " viewBox="0 0 448 512" width="15" height="15" fill="currentColor" aria-hidden="true" focusable="false"><path d="M216.464 36.465l-7.071 7.07c-4.686 4.686-4.686 12.284 0 16.971L387.887 239H12c-6.627 0-12 5.373-12 12v10c0 6.627 5.373 12 12 12h375.887L209.393 451.494c-4.686 4.686-4.686 12.284 0 16.971l7.071 7.07c4.686 4.686 12.284 4.686 16.97 0l211.051-211.05c4.686-4.686 4.686-12.284 0-16.971L233.434 36.465c-4.686-4.687-12.284-4.687-16.97 0z" /></svg>
			</button>

			<!-- در گفتگو: نام گفتگو با فلش. در صفحهٔ خالی: نام پروژه، وسط‌چین. -->
			<button class="btn quiet chat-title" id="session-title" hidden>
				<span id="session-title-text">گفتگوی تازه</span>
				<svg class="ic " viewBox="0 0 448 512" width="12" height="12" fill="currentColor" aria-hidden="true" focusable="false"><path d="M443.5 162.6l-7.1-7.1c-4.7-4.7-12.3-4.7-17 0L224 351 28.5 155.5c-4.7-4.7-12.3-4.7-17 0l-7.1 7.1c-4.7 4.7-4.7 12.3 0 17l211 211.1c4.7 4.7 12.3 4.7 17 0l211-211.1c4.8-4.7 4.8-12.3.1-17z" /></svg>
			</button>

			<button class="btn quiet sm plan-chip" id="plan-chip" tabindex="-1">
				<span id="plan-text">—</span>
			</button>

			<div class="top-right">
				<button class="btn outline" id="btn-share" hidden title="خروجی گفتگو" data-t="اشتراک">اشتراک</button>
				<span class="ctx-chip" id="context-meter" title="مصرف کانتکست" data-t-title="مصرف کانتکست"><span id="meter-text">۰٪</span></span>
				<button class="btn icon round quiet" id="btn-more" title="بیشتر" data-t-title="بیشتر">
					<svg class="ic " viewBox="0 0 320 512" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M192 256c0 17.7-14.3 32-32 32s-32-14.3-32-32 14.3-32 32-32 32 14.3 32 32zm88-32c-17.7 0-32 14.3-32 32s14.3 32 32 32 32-14.3 32-32-14.3-32-32-32zm-240 0c-17.7 0-32 14.3-32 32s14.3 32 32 32 32-14.3 32-32-14.3-32-32-32z" /></svg>
				</button>
				<div id="more-menu" class="pop-menu more-menu" hidden></div>
			</div>
		</header>

		<!-- نمای گفتگو -->
		<div class="view view-chat" id="view-chat">
			<div class="thread" id="chat">
				<div class="welcome" id="welcome">
					<span class="greet-mark" id="greet-mark"></span>
					<h2 class="greet" id="greet-text" data-t="به هوشا خوش آمدی">به هوشا خوش آمدی</h2>
					<p class="greet-sub" id="greet-sub" data-t="چه کاری برایت انجام بدهم؟">چه کاری برایت انجام بدهم؟</p>
				</div>
			</div>

			<div class="composer-wrap">
				<!-- جای دکمهٔ «برو به آخر»: بالای کادر نوشتن، وسطِ همان ستون. -->
				<div class="jump-slot" id="jump-slot"></div>
				<div id="queue" class="queue" hidden></div>
				<div id="cmd-menu" class="pop-menu" hidden></div>
				<div id="plus-menu" class="pop-menu plus-menu" hidden></div>
				<div id="model-menu" class="pop-menu model-menu" hidden></div>

				<form id="composer" class="composer">
					<div id="attachments" class="attachments" hidden></div>
					<textarea id="input" rows="1" placeholder="امروز چه کمکی از من برمی‌آید؟" data-t-ph="امروز چه کمکی از من برمی‌آید؟"></textarea>

					<div class="composer-bar">
						<button type="button" class="btn icon quiet" id="btn-plus" title="افزودن و ابزارها" data-t-title="افزودن و ابزارها"><svg class="ic " viewBox="0 0 384 512" width="17" height="17" fill="currentColor" aria-hidden="true" focusable="false"><path d="M376 232H216V72c0-4.42-3.58-8-8-8h-32c-4.42 0-8 3.58-8 8v160H8c-4.42 0-8 3.58-8 8v32c0 4.42 3.58 8 8 8h160v160c0 4.42 3.58 8 8 8h32c4.42 0 8-3.58 8-8V280h160c4.42 0 8-3.58 8-8v-32c0-4.42-3.58-8-8-8z" /></svg></button>
						<input type="file" id="file-input" accept="image/*" multiple hidden />

						<span class="grow"></span>

						<button type="button" class="btn quiet" id="pill-model" title="مدل">
							<span id="model-name">—</span>
						</button>
						<button type="button" class="btn quiet sm" id="pill-mode" data-mode="default" title="حالت کار (Shift+Tab)">عادی</button>
						<button type="button" class="btn icon quiet" id="btn-mic" title="گفتن به‌جای نوشتن (Ctrl+M)" data-t-title="گفتن به‌جای نوشتن (Ctrl+M)">
							<svg class="ic " viewBox="0 0 448 512" width="14" height="14" fill="currentColor" aria-hidden="true" focusable="false"><path d="M443.5 248.5l-7.1-7.1c-4.7-4.7-12.3-4.7-17 0L241 419.9V44c0-6.6-5.4-12-12-12h-10c-6.6 0-12 5.4-12 12v375.9L28.5 241.4c-4.7-4.7-12.3-4.7-17 0l-7.1 7.1c-4.7 4.7-4.7 12.3 0 17l211 211.1c4.7 4.7 12.3 4.7 17 0l211-211.1c4.8-4.8 4.8-12.3.1-17z" /></svg>
						</button>
						<button type="button" class="btn icon quiet" id="btn-voice" title="بلندخوانی پاسخ" data-t-title="بلندخوانی پاسخ">
							<svg class="ic " viewBox="0 0 640 512" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M232 96h-16a8 8 0 0 0-8 8v304a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V104a8 8 0 0 0-8-8zm-96 96h-16a8 8 0 0 0-8 8v112a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V200a8 8 0 0 0-8-8zm-96 32H24a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8zm384-96h-16a8 8 0 0 0-8 8v240a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V136a8 8 0 0 0-8-8zm192 96h-16a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8zM520 64h-16a8 8 0 0 0-8 8v368a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V72a8 8 0 0 0-8-8zM328 0h-16a8 8 0 0 0-8 8v496a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V8a8 8 0 0 0-8-8z" /></svg>
						</button>

						</button>
					</div>

				</form>

				<!--
					نوار گیت — این یکی در Claude نیست و عمداً اضافه شده: خواستهٔ صریح
					کارفرما از روی رابط Arena بود. بقیهٔ اجزا کپی برابر اصل‌اند.
				-->
				<div class="git-bar" id="git-bar" hidden>
					<button type="button" class="btn quiet sm git-chip" id="git-repo" title="مخزن — کلیک برای تعویض یا اتصال">
						<svg class="ic " viewBox="0 0 448 512" width="13" height="13" fill="currentColor" aria-hidden="true" focusable="false"><path d="M356 160H188c-6.6 0-12-5.4-12-12v-8c0-6.6 5.4-12 12-12h168c6.6 0 12 5.4 12 12v8c0 6.6-5.4 12-12 12zm12 52v-8c0-6.6-5.4-12-12-12H188c-6.6 0-12 5.4-12 12v8c0 6.6 5.4 12 12 12h168c6.6 0 12-5.4 12-12zm64.7 268h3.3c6.6 0 12 5.4 12 12v8c0 6.6-5.4 12-12 12H80c-44.2 0-80-35.8-80-80V80C0 35.8 35.8 0 80 0h344c13.3 0 24 10.7 24 24v368c0 10-6.2 18.6-14.9 22.2-3.6 16.1-4.4 45.6-.4 65.8zM128 384h288V32H128v352zm-96 16c13.4-10 30-16 48-16h16V32H80c-26.5 0-48 21.5-48 48v320zm372.3 80c-3.1-20.4-2.9-45.2 0-64H80c-64 0-64 64 0 64h324.3z" /></svg>
						<span id="git-repo-name">—</span>
					</button>

					<button type="button" class="btn quiet sm git-chip" id="git-branch" title="شاخه — کلیک برای تعویض یا ساخت">
						<svg class="ic " viewBox="0 0 384 512" width="13" height="13" fill="currentColor" aria-hidden="true" focusable="false"><path d="M384 144c0-44.2-35.8-80-80-80s-80 35.8-80 80c0 39.2 28.2 71.8 65.5 78.7-.8 17.2-5 30.4-12.7 40-17.5 21.8-53.1 25.2-90.7 28.7-28.2 2.6-57.4 5.4-80.4 16.9-3.4 1.7-6.7 3.6-9.7 5.7V158.4c36.5-7.4 64-39.7 64-78.4 0-44.2-35.8-80-80-80S0 35.8 0 80c0 38.7 27.5 71 64 78.4v195.2C27.5 361 0 393.3 0 432c0 44.2 35.8 80 80 80s80-35.8 80-80c0-36.9-24.9-67.9-58.9-77.2 5-9.6 12.3-14.6 19-18 17.5-8.8 42.5-11.2 68.9-13.7 42.6-4 86.7-8.1 112.7-40.5 12.4-15.5 19-35.5 19.8-60.7C357.3 214 384 182.1 384 144zM32 80c0-26.5 21.5-48 48-48s48 21.5 48 48-21.5 48-48 48-48-21.5-48-48zm96 352c0 26.5-21.5 48-48 48s-48-21.5-48-48c0-26.4 21.4-47.9 47.8-48h.6c26.3.2 47.6 21.7 47.6 48zm187.8-241.5L304 192c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48c0 22.4-15.4 41.2-36.2 46.5z" /></svg>
						<span id="git-branch-name">—</span>
					</button>

					<button type="button" class="btn quiet sm mono" id="git-stat" title="تغییرات — کلیک برای دیدن دیف">
						<span class="plus" id="git-plus">+۰</span>
						<span class="minus" id="git-minus">−۰</span>
					</button>

					<button type="button" class="btn solid sm push-end" id="git-action">ثبت تغییرات</button>
				</div>

				<div id="git-menu" class="pop-menu git-menu" hidden></div>

				<p class="disclaimer" data-t="هوشا هم اشتباه می‌کند. کارهای مهم را خودت بازبینی کن.">هوشا هم اشتباه می‌کند. کارهای مهم را خودت بازبینی کن.</p>
			</div>
		</div>

		<!-- نمای صفحه‌ها (گفتگوها، پروژه‌ها، ابزارها، تغییرات، فضای کار) -->
		<div class="view page" id="view-panel" hidden>
			<div class="page-inner" id="panel-body"></div>
		</div>
	 </div>
	</main>
</div>
