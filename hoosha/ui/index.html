<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>هوشا</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#faf9f5" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- وقتی سرور از یک کپیِ منجمد اجرا شده باشد، این نوار ظاهر می‌شود. پیش‌فرض پنهان است
     و فقط app.js با دیدن install.frozen بازش می‌کند. -->
<div class="stale-bar" id="stale-bar" hidden></div>

<!--
	چیدمان: دو ستون.

	یک نوار کناری و یک ناحیهٔ محتوا — همان چیزی که در تصاویر Claude هست. ستون میانیِ
	فهرست گفتگو و ریل سمت دیگر حذف شدند: اولی داخل نوار کناری رفت (زیر «اخیر») و دومی
	به صفحهٔ فضای کار.
-->
<div class="app">

	<!-- ══════════════════════════════════════════════════ نوار کناری -->
	<aside class="sidebar" id="sidebar">

		<div class="side-top">
			<div class="wordmark">هوشا<span class="ver" id="brand-version"></span></div>
			<div class="side-top-actions">
				<button class="btn icon round quiet" id="btn-search" title="جستجو (Ctrl+K)" data-t-title="جستجو (Ctrl+K)">
					<svg viewBox="0 0 20 20" width="17" height="17"><circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
				</button>
				<button class="btn icon round quiet" id="btn-collapse" title="بستن نوار کناری" data-t-title="بستن نوار کناری">
					<svg viewBox="0 0 20 20" width="18" height="18"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="7.5" y1="3.5" x2="7.5" y2="16.5" stroke="currentColor" stroke-width="1.4"/></svg>
				</button>
			</div>
		</div>

		<button class="btn quiet row new-chat" id="btn-new">
			<span class="nc-plus">+</span><span data-t="گفتگوی تازه">گفتگوی تازه</span>
		</button>

		<nav class="side-nav" id="side-nav">
			<button class="btn quiet row nav-item" data-view="chats">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M3 6.5A3.5 3.5 0 016.5 3h7A3.5 3.5 0 0117 6.5v4A3.5 3.5 0 0113.5 14H8l-4 3v-3.2A3.5 3.5 0 013 10.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
				<span data-t="گفتگوها">گفتگوها</span>
			</button>
			<button class="btn quiet row nav-item" data-view="projects">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M3 6.5A1.5 1.5 0 014.5 5h3l1.5 2h6.5A1.5 1.5 0 0117 8.5v6A1.5 1.5 0 0115.5 16h-11A1.5 1.5 0 013 14.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
				<span data-t="پروژه‌ها">پروژه‌ها</span>
			</button>
			<button class="btn quiet row nav-item" data-view="tools">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M12.5 2.5a4 4 0 00-3.6 5.7L3 14.1V17h2.9l5.9-5.9a4 4 0 105.2-5.2l-2.4 2.4-1.8-1.8 2.4-2.4a4 4 0 00-2.7-1.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
				<span data-t="ابزارها">ابزارها</span>
			</button>
			<button class="btn quiet row nav-item" data-view="changes">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M7.5 5L3.5 10l4 5M12.5 5l4 5-4 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
				<span data-t="تغییرات">تغییرات</span>
				<b class="nav-badge" id="nav-changes-count" hidden></b>
			</button>
			<button class="btn quiet row nav-item" data-view="customize">
				<svg viewBox="0 0 20 20" width="17" height="17"><path d="M4 6h12M4 10h12M4 14h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="6" r="1.9" fill="var(--sidebar)" stroke="currentColor" stroke-width="1.4"/><circle cx="13" cy="10" r="1.9" fill="var(--sidebar)" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="14" r="1.9" fill="var(--sidebar)" stroke="currentColor" stroke-width="1.4"/></svg>
				<span data-t="سفارشی‌سازی">سفارشی‌سازی</span>
			</button>
		</nav>

		<div class="side-label" data-t="امکانات">امکانات</div>
		<nav class="side-nav">
			<button class="btn quiet row nav-item" data-view="workspace">
				<svg viewBox="0 0 20 20" width="17" height="17"><rect x="3" y="4.5" width="14" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 8h14" stroke="currentColor" stroke-width="1.4"/></svg>
				<span data-t="فضای کار">فضای کار</span>
			</button>
		</nav>

		<div class="side-label">
			<span class="grow" data-t="اخیر">اخیر</span>
			<button class="btn icon round quiet" id="btn-recents-more" title="همهٔ گفتگوها" data-t-title="همهٔ گفتگوها">
				<svg viewBox="0 0 20 20" width="15" height="15"><path d="M4 7h12M6.5 10h7M8.5 13h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
			</button>
		</div>
		<div class="side-scroll" id="session-list"></div>

		<div class="side-bottom">
			<div class="account-row">
				<button class="btn quiet row account-main" id="btn-account" title="حساب و تنظیمات" data-t-title="حساب و تنظیمات">
					<span class="avatar-dot" id="account-initial">ه</span>
					<span class="acc-lines">
						<b id="account-name">پروفایل</b>
						<span class="acc-text" id="chip-provider">—</span>
					</span>
					<svg class="acc-chev" viewBox="0 0 20 20" width="15" height="15"><path d="M6 12l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<button class="btn icon round quiet" id="btn-export" title="خروجی گفتگو">
					<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9M6.5 8.5L10 12l3.5-3.5M4 15.5h12"/></svg>
				</button>
			</div>
			<div class="account-menu" id="account-menu" hidden></div>
		</div>
	</aside>

	<!-- ══════════════════════════════════════════════════ ناحیهٔ اصلی -->
	<main class="main">
	 <div class="main-card">

		<header class="topbar">
			<button class="btn icon round quiet" id="btn-back" title="بازگشت به گفتگو" data-t-title="بازگشت به گفتگو" hidden>
				<svg viewBox="0 0 20 20" width="16" height="16"><path d="M12 5l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</button>

			<!-- در گفتگو: نام گفتگو با فلش. در صفحهٔ خالی: نام پروژه، وسط‌چین. -->
			<button class="btn quiet chat-title" id="session-title" hidden>
				<span id="session-title-text">گفتگوی تازه</span>
				<svg viewBox="0 0 20 20" width="13" height="13"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</button>

			<button class="btn quiet sm plan-chip" id="plan-chip" tabindex="-1">
				<span id="plan-text">—</span>
			</button>

			<div class="top-right">
				<button class="btn outline" id="btn-share" hidden title="خروجی گفتگو" data-t="اشتراک">اشتراک</button>
				<span class="ctx-chip" id="context-meter" title="مصرف کانتکست" data-t-title="مصرف کانتکست"><span id="meter-text">۰٪</span></span>
				<button class="btn icon round quiet" id="btn-more" title="بیشتر" data-t-title="بیشتر">
					<svg viewBox="0 0 20 20" width="16" height="16"><circle cx="5" cy="10" r="1.4" fill="currentColor"/><circle cx="10" cy="10" r="1.4" fill="currentColor"/><circle cx="15" cy="10" r="1.4" fill="currentColor"/></svg>
				</button>
				<div id="more-menu" class="pop-menu more-menu" hidden></div>
			</div>
		</header>

		<!-- نمای گفتگو -->
		<div class="view view-chat" id="view-chat">
			<div class="thread" id="chat">
				<div class="welcome" id="welcome">
					<div class="greet"><span class="greet-mark" id="greet-mark"></span><span id="greet-text">چه خبر؟</span></div>
				</div>
			</div>

			<div class="composer-wrap">
				<div id="queue" class="queue" hidden></div>
				<div id="cmd-menu" class="pop-menu" hidden></div>
				<div id="plus-menu" class="pop-menu plus-menu" hidden></div>
				<div id="model-menu" class="pop-menu model-menu" hidden></div>

				<form id="composer" class="composer">
					<div id="attachments" class="attachments" hidden></div>
					<textarea id="input" rows="1" placeholder="امروز چه کمکی از من برمی‌آید؟" data-t-ph="امروز چه کمکی از من برمی‌آید؟"></textarea>

					<div class="composer-bar">
						<button type="button" class="btn icon quiet" id="btn-plus" title="افزودن و ابزارها" data-t-title="افزودن و ابزارها">+</button>
						<input type="file" id="file-input" accept="image/*" multiple hidden />

						<span class="grow"></span>

						<button type="button" class="btn quiet" id="pill-model" title="مدل">
							<span id="model-name">—</span>
						</button>
						<button type="button" class="btn quiet sm" id="pill-mode" data-mode="default" title="حالت کار (Shift+Tab)">عادی</button>
						<button type="button" class="btn icon quiet" id="btn-mic" title="گفتن به‌جای نوشتن (Ctrl+M)" data-t-title="گفتن به‌جای نوشتن (Ctrl+M)">
							<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="7.5" y="2.5" width="5" height="9" rx="2.5"/><path d="M4.5 9.5a5.5 5.5 0 0011 0M10 15v2.5"/></svg>
						</button>
						<button type="button" class="btn icon quiet" id="btn-voice" title="بلندخوانی پاسخ" data-t-title="بلندخوانی پاسخ">
							<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8v4M6.5 5.5v9M10 3v14M13.5 5.5v9M17 8v4"/></svg>
						</button>
						<button id="stop" type="button" class="btn icon solid" hidden title="توقف (Esc)" data-t-title="توقف (Esc)">■</button>
						<button id="send" type="submit" class="btn icon brand" hidden title="ارسال" data-t-title="ارسال">
							<svg viewBox="0 0 20 20" width="16" height="16"><path d="M10 16V5M5.5 9.5L10 5l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
						</button>
					</div>

					<!--
						نوار گیت — این یکی در Claude نیست و عمداً اضافه شده: خواستهٔ صریح
						کارفرما از روی رابط Arena بود. بقیهٔ اجزا کپی برابر اصل‌اند.
					-->
					<div class="git-bar" id="git-bar" hidden>
						<button type="button" class="btn quiet sm git-chip" id="git-repo" title="مخزن — کلیک برای تعویض یا اتصال">
							<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4.5A1.5 1.5 0 015.5 3H15v11H5.5A1.5 1.5 0 004 15.5z"/><path d="M4 15.5A1.5 1.5 0 015.5 14H15v3H5.5A1.5 1.5 0 014 15.5z"/></svg>
							<span id="git-repo-name">—</span>
						</button>

						<button type="button" class="btn quiet sm git-chip" id="git-branch" title="شاخه — کلیک برای تعویض یا ساخت">
							<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="15" r="2"/><circle cx="14" cy="8" r="2"/><path d="M6 7v6M8 8h2a2 2 0 012 2v3"/></svg>
							<span id="git-branch-name">—</span>
						</button>

						<button type="button" class="btn quiet sm mono" id="git-stat" title="تغییرات — کلیک برای دیدن دیف">
							<span class="plus" id="git-plus">+۰</span>
							<span class="minus" id="git-minus">−۰</span>
						</button>

						<button type="button" class="btn solid sm push-end" id="git-action">ثبت تغییرات</button>
					</div>
				</form>

				<div id="git-menu" class="pop-menu git-menu" hidden></div>

				<p class="disclaimer" data-t="هوشا هم اشتباه می‌کند. کارهای مهم را خودت بازبینی کن.">هوشا هم اشتباه می‌کند. کارهای مهم را خودت بازبینی کن.</p>
			</div>
		</div>

		<!-- نمای صفحه‌ها (گفتگوها، پروژه‌ها، ابزارها، تغییرات، فضای کار) -->
		<div class="view page" id="view-panel" hidden>
			<div class="page-inner" id="panel-body"></div>
		</div>
	 </div>
	</main>
</div>

<!-- ═══════════════════════════════════════════════ تنظیمات: مودال بزرگ -->
<dialog class="set-modal" id="settings">
	<div class="set-shell">
		<nav class="set-nav" id="set-nav"></nav>
		<div class="set-main">
			<div class="set-head">
				<h2 id="set-title" data-t="تنظیمات">تنظیمات</h2>
				<div class="set-head-actions" id="set-head-actions"></div>
				<button class="btn icon round quiet" id="set-close" title="بستن" data-t-title="بستن">
					<svg viewBox="0 0 20 20" width="17" height="17"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
				</button>
			</div>
			<div class="set-body" id="set-body"></div>
		</div>
	</div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
