<!--
	نشان هوشا.

	خانوادهٔ بصری‌اش همان «جرقه»ای است که Claude دارد، ولی شکلش مالِ خودمان است:
	هشت پرتوی گرد با دو طول متفاوت — چهار پرتوی بلند در جهت‌های اصلی و چهار پرتوی کوتاه
	روی قطرها — دور یک هستهٔ روشن. یعنی «فکری که از یک هسته بیرون می‌زند».

	تک‌رنگ هم درست کار می‌کند (currentColor)، پس در نوار کناری، فاوآیکون و حالت تک‌رنگ
	یکی است.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="هوشا">
	<defs>
		<linearGradient id="hoosha-g" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#e8895f" />
			<stop offset="1" stop-color="#c2593a" />
		</linearGradient>
	</defs>

	<g fill="url(#hoosha-g)">
		<!-- چهار پرتوی بلند -->
		<rect x="14.7" y="1.6" width="2.6" height="11" rx="1.3" />
		<rect x="14.7" y="19.4" width="2.6" height="11" rx="1.3" />
		<rect x="1.6" y="14.7" width="11" height="2.6" rx="1.3" />
		<rect x="19.4" y="14.7" width="11" height="2.6" rx="1.3" />

		<!-- چهار پرتوی کوتاه روی قطرها -->
		<rect x="14.9" y="5.6" width="2.2" height="8" rx="1.1" transform="rotate(45 16 16)" />
		<rect x="14.9" y="18.4" width="2.2" height="8" rx="1.1" transform="rotate(45 16 16)" />
		<rect x="14.9" y="5.6" width="2.2" height="8" rx="1.1" transform="rotate(-45 16 16)" />
		<rect x="14.9" y="18.4" width="2.2" height="8" rx="1.1" transform="rotate(-45 16 16)" />

		<!-- هسته -->
		<circle cx="16" cy="16" r="3.1" />
	</g>
</svg>
