<!--
	نسخهٔ متحرک نشان هوشا — همان چیزی که موقع کارکردن مدل نشان داده می‌شود.

	دو حرکت روی هم:
	  ۱) کل نشان آرام می‌چرخد (۳ ثانیه، خطی) — یعنی «چیزی در جریان است».
	  ۲) پرتوها به‌نوبت روشن و کم‌رنگ می‌شوند — یعنی «دارد کار می‌کند، گیر نکرده».

	انیمیشن با SMIL نوشته شده نه CSS، تا وقتی این فایل به‌عنوان <img> یا فاوآیکون هم
	استفاده شد باز حرکت کند.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="در حال کار">
	<defs>
		<linearGradient id="hoosha-live" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#e8895f" />
			<stop offset="1" stop-color="#c2593a" />
		</linearGradient>
	</defs>

	<g fill="url(#hoosha-live)">
		<animateTransform
			attributeName="transform"
			attributeType="XML"
			type="rotate"
			from="0 16 16"
			to="360 16 16"
			dur="3s"
			repeatCount="indefinite" />

		<rect x="14.7" y="1.6" width="2.6" height="11" rx="1.3">
			<animate attributeName="opacity" values="1;0.25;1" dur="1.2s" begin="0s" repeatCount="indefinite" />
		</rect>
		<rect x="19.4" y="14.7" width="11" height="2.6" rx="1.3">
			<animate attributeName="opacity" values="1;0.25;1" dur="1.2s" begin="0.15s" repeatCount="indefinite" />
		</rect>
		<rect x="14.7" y="19.4" width="2.6" height="11" rx="1.3">
			<animate attributeName="opacity" values="1;0.25;1" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
		</rect>
		<rect x="1.6" y="14.7" width="11" height="2.6" rx="1.3">
			<animate attributeName="opacity" values="1;0.25;1" dur="1.2s" begin="0.45s" repeatCount="indefinite" />
		</rect>

		<rect x="14.9" y="5.6" width="2.2" height="8" rx="1.1" transform="rotate(45 16 16)">
			<animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" begin="0.07s" repeatCount="indefinite" />
		</rect>
		<rect x="14.9" y="18.4" width="2.2" height="8" rx="1.1" transform="rotate(45 16 16)">
			<animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" begin="0.37s" repeatCount="indefinite" />
		</rect>
		<rect x="14.9" y="5.6" width="2.2" height="8" rx="1.1" transform="rotate(-45 16 16)">
			<animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" begin="0.52s" repeatCount="indefinite" />
		</rect>
		<rect x="14.9" y="18.4" width="2.2" height="8" rx="1.1" transform="rotate(-45 16 16)">
			<animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" begin="0.22s" repeatCount="indefinite" />
		</rect>

		<circle cx="16" cy="16" r="3.1">
			<animate attributeName="r" values="3.1;2.2;3.1" dur="1.2s" repeatCount="indefinite" />
		</circle>
	</g>
</svg>
